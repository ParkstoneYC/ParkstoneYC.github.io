<!DOCTYPE html>
<html lang="en-GB"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex"><title>Parkstone Yacht Club – Event booking</title>
<script>
  // Short links for the Parkstone Yacht Club event portal.
  //   /e/3            → booking page for event EVT003 (keeps ?key=… for invitation links)
  //   /e/3?key=abc    → invite-only / passphrase-free invitation link
  //   anything else   → the public booking page
  var BASE = 'https://script.google.com/macros/s/AKfycbwcIZubItvIaGVtsH0ZaD0HXJqBUwMnOZIglg9mMvqmlnqqcQImPcf1md77yKk13UeF/exec';
  var m = location.pathname.match(/\/e\/0*(\d+)\/?$/i), q = location.search.replace(/^\?/, '');
  var url = BASE;
  if (m) { var n = m[1]; while (n.length < 3) n = '0' + n; url = BASE + '?event=EVT' + n + (q ? '&' + q : ''); }
  else if (q) url = BASE + '?' + q;
  location.replace(url + location.hash);
</script>
